# Scheduled SHAKEmap sweep for the Bumelerze Atlas.
#
# Polls the earthquake feeds, computes products for events that need them,
# publishes the vector artifacts into this repository, and indexes them in
# Supabase. This is the periodic catch-up lane, not the rapid-response one:
# GitHub delays scheduled runs under load, so urgent response belongs to a
# dedicated always-on host. See OPERATIONS.md in the engine repository.
#
# Publishing needs no configured credential: a workflow running here gets a
# token scoped to write to this repository. Supabase indexing needs the two
# repository secrets below. Setting VS30_RASTER_URL is optional and raises
# computed products from the default rock site model to the full raster.

name: Shake-service scheduled worker

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# Never run two sweeps at once against the same worker_state.json cache --
# a genuine correctness requirement, not just tidiness: two concurrent
# writers to the bml-id allocation counters (shake_service/event_id.py's
# own "single allocation authority" invariant) could mint colliding ids.
# `cancel-in-progress: false` queues a run that starts before the previous
# one finishes, rather than racing it.
concurrency:
  group: shake-worker
  cancel-in-progress: false

# `contents: write` is scoped to the repo THIS workflow lives in (the Atlas
# repo) -- it is what lets the final `git push` step below use the
# automatic GITHUB_TOKEN instead of a configured secret. It grants nothing
# on `bumelerze-engine`, which this workflow only ever reads from, via a
# read-only deploy key -- see the safety note above the commit step.
permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      # Promoted from secrets so step-level `if:` can test it;
      # the secrets context is not available in step conditions.
      VS30_RASTER_URL: ${{ secrets.VS30_RASTER_URL }}
    timeout-minutes: 20
    steps:
      # --- Fail loudly, first, before any network/compute work, if the
      # required secrets aren't configured on THIS (Atlas) repo. A
      # scheduled job that silently falls back to local-only mode and
      # discards everything when the runner is torn down is worse than one
      # that fails and gets noticed (this mirrors --require-supabase's own
      # check inside run_worker.py, applied here at the workflow level too
      # since a missing secret should never even reach the Python process).
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.SUPABASE_URL }}" ] && missing+=("SUPABASE_URL")
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "${{ secrets.ENGINE_DEPLOY_KEY }}" ] && missing+=("ENGINE_DEPLOY_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secret(s) on this (bumelerze-atlas) repository: ${missing[*]}. Refusing to run in a silent local-only mode -- create them under Settings -> Secrets and variables -> Actions. See OPERATIONS.md ('Scheduled lane') in Peshawa-LH/bumelerze-engine for what each one is."
            exit 1
          fi

      # --- This repo (bumelerze-atlas): the workflow's own checkout, and
      # the publish target. `persist-credentials: true` (the default, named
      # explicitly here because the whole zero-token design depends on it)
      # leaves an authenticated `origin` remote in place so the commit/push
      # step at the end needs no extra secret.
      - name: Checkout this repository (bumelerze-atlas)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # --- The engine repo, read-only. Since the 2026-08-24 repo split the
      # engine lives in Peshawa-LH/bumelerze-engine, which is PRIVATE, so
      # the built-in GITHUB_TOKEN cannot read it (that token is scoped to
      # the repository the workflow lives in). Authentication is a
      # read-only deploy key registered on the engine repo, held here as
      # the ENGINE_DEPLOY_KEY secret. `persist-credentials: false` keeps
      # that key out of the checkout's git config so no later step can
      # reuse it, and the key is read-only anyway, so this workflow cannot
      # write to the engine repository even by accident.
      - name: Checkout bumelerze-engine (private, read-only)
        uses: actions/checkout@v4
        with:
          repository: Peshawa-LH/bumelerze-engine
          path: bumelerze-engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bumelerze-engine/requirements.txt

      # --- openquake.engine hard-pins `gdal~=3.13.1` on Linux, while the
      # runner's apt repositories carry 3.8.x. The Python binding is a thin
      # wrapper compiled against the system library, so the two versions
      # must match exactly and no combination of apt packages satisfies the
      # pin. conda-forge ships prebuilt binaries for the required version,
      # which is the usual answer for this dependency in CI.
      #
      # Worth recording: this service's own code never imports GDAL. It
      # arrives purely as a declared dependency of openquake, and the
      # worker path would run without it. We satisfy it properly rather
      # than bypassing the resolver, so the installed environment matches
      # what the engine expects.
      - name: Set up the conda-forge toolchain with GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: shake
          create-args: >-
            python=3.11
            gdal=3.13.1
          cache-environment: true
          init-shell: bash

      - name: Install engine Python dependencies
        working-directory: bumelerze-engine
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          # GDAL already comes from conda-forge above, so keep pip from
          # trying to rebuild it from source against the wrong library.
          grep -v '^GDAL==' requirements.txt > /tmp/requirements-ci.txt
          time pip install -r /tmp/requirements-ci.txt
          python -c "from osgeo import gdal; print('gdal', gdal.__version__)"

      - name: Verify the openquake install (README.md's own gate check)
        working-directory: bumelerze-engine
        shell: bash -el {0}
        run: |
          python -c "
          from openquake.hazardlib.contexts import ContextMaker
          from openquake.hazardlib.gsim.chiou_youngs_2014 import ChiouYoungs2014
          from openquake.hazardlib.gsim.akkar_2014 import AkkarEtAlRjb2014
          from openquake.hazardlib.gsim.boore_2014 import BooreEtAl2014
          from openquake.hazardlib.gsim.kale_2015 import KaleEtAl2015Iran
          print('ok')
          "

      # --- Worker state persistence across scheduled runs. GitHub Actions
      # runners are ephemeral -- with nothing here, EVERY run would start
      # from a blank worker_state.json, which would re-detect every already
      # -tracked event as brand new: a fresh bml id minted again for an
      # event that already has one (shake_service/event_id.py's own
      # "assigned exactly once, immutable forever" rule), and every product
      # recomputed back at v1 instead of advancing. The cache key includes
      # `github.run_id` (unique per run) with a plain-prefix `restore-keys`
      # fallback, because `actions/cache` cannot overwrite an existing key
      # -- this is the standard pattern for a cache that must be updated
      # every run, not just written once.
      #
      # IMPORTANT operational note (see OPERATIONS.md's own "Scheduled
      # lane" section for the full explanation): this cache is now the
      # single allocation authority for THIS lane. Do not also run
      # `scripts/run_worker.py --daemon` locally against a *different*
      # `worker_state.json` while this workflow is enabled -- two separate
      # state files tracking the same live feeds is exactly the "second
      # counter space" collision event_id.py's own docstring warns about.
      - name: Restore worker state (bml-id counters, product versions, idempotency hashes)
        uses: actions/cache/restore@v4
        with:
          path: |
            bumelerze-engine/worker_state.json
            bumelerze-engine/regional-catalog/live-catalog.jsonl
          key: shake-worker-state-${{ github.run_id }}
          restore-keys: |
            shake-worker-state-

      # --- THE VS30 DECISION (see the engine repo's OPERATIONS.md's own
      # "Scheduled lane -> Vs30" section for the full writeup; summary
      # here). The engine's real Vs30 site-amplification raster is a
      # ~610 MB file that lives only on Peshawa's machine today
      # (shake_service/config.py's DEFAULT_VS30_RASTER_PATH, an absolute
      # local path) -- a CI runner will never have it unless this lane
      # fetches its own copy. Chosen approach: fetch-if-configured (option
      # a), automatic honest fallback otherwise (option c) -- NEVER refuse
      # to compute (option b would gut this lane's whole "catch-up /
      # backfill" purpose, since most triggering events need a map, not
      # zero maps). `VS30_RASTER_URL` is OPTIONAL: if it is not set, the
      # steps below are skipped entirely and every product this run
      # computes uses the engine's own already-built-in graceful fallback
      # (`shake_service.vs30.default_sampler()`: rock-760 uniform site
      # conditions, LOUDLY logged) -- never silently downgraded, and never
      # indistinguishable from a full-quality product: every product's
      # `info.json` already carries a top-level `vs30.vs30_source` field
      # ("raster" | "rock-default"), and this task additionally wired that
      # same field into the Supabase `shakemap_products` INDEX row's
      # `data_used.vs30` (shake_service/worker/uploader.py's
      # `_vs30_from_info`) -- so a degraded product is honestly labeled at
      # BOTH the artifact layer and the fast queryable-index layer, not
      # just one of them.
      - name: Restore cached Vs30 raster (only if VS30_RASTER_URL is configured)
        if: ${{ env.VS30_RASTER_URL != '' }}
        id: vs30-cache
        uses: actions/cache@v4
        with:
          path: vs30-cache/global_vs30.grd
          key: vs30-raster-v1

      - name: Fetch the Vs30 raster from durable storage
        if: ${{ env.VS30_RASTER_URL != '' && steps.vs30-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p vs30-cache
          curl -fSL "$VS30_RASTER_URL" -o vs30-cache/global_vs30.grd

      - name: Point the engine at the cached raster
        if: ${{ env.VS30_RASTER_URL != '' }}
        run: echo "BUMELERZE_VS30_RASTER_PATH=$PWD/vs30-cache/global_vs30.grd" >> "$GITHUB_ENV"

      # --- The sweep itself: one full cycle across USGS (all_hour poll +
      # region sweep), EMSC, and GEOFON (scripts/run_worker.py --once,
      # unchanged shape -- this is already the single-sweep entry point,
      # nothing new needed there). `--require-supabase` is the Python-level
      # mirror of this workflow's own secret check above (belt-and-braces:
      # even if this workflow file is ever copied somewhere the shell
      # preflight was skipped, the script itself still refuses to fall back
      # silently). Products are written straight into THIS job's own
      # checkout of the Atlas repo (`BUMELERZE_ATLAS_PUBLISH_ROOT:
      # ${{ github.workspace }}`) instead of the default `atlas-publish/`
      # staging directory, and instead of `scripts/publish_atlas.sh`.
      # That script clones its OWN separate copy of the Atlas repo and
      # therefore needs its OWN push credential (a PAT) to publish from
      # -- exactly the awkward secret this workflow's location in the
      # Atlas repo was chosen to avoid. The checkout above already left
      # this exact directory authenticated via the built-in GITHUB_TOKEN
      # (`persist-credentials: true` + `permissions: contents: write`), so
      # writing products directly into it and committing in place needs no
      # extra secret at all. `scripts/publish_atlas.sh` is unchanged and
      # still the right tool for Peshawa's own local/manual runs (a
      # separate clone, a separate token) -- see OPERATIONS.md for both
      # paths side by side.
      - name: Run one worker sweep, publishing straight into this checkout
        working-directory: bumelerze-engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUMELERZE_ATLAS_PUBLISH_ROOT: ${{ github.workspace }}
          BUMELERZE_ATLAS_BASE_URL: https://peshawa-lh.github.io/bumelerze-atlas
        shell: bash -el {0}
        run: |
          mkdir -p regional-catalog
          python scripts/run_worker.py --once --require-supabase

      # `if: always()` -- save whatever state this run produced even if the
      # sweep step above failed partway (run_worker.py's own `run_once` now
      # saves state in a `finally` too, for the same reason at the Python
      # level: partial progress from an earlier feed leg must never be
      # lost just because a later leg failed).
      - name: Save worker state for the next scheduled run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bumelerze-engine/worker_state.json
            bumelerze-engine/regional-catalog/live-catalog.jsonl
          key: shake-worker-state-${{ github.run_id }}

      # --- Commit and push, scoped ONLY to what AtlasRepoPublisher
      # actually writes (events/, index.json) -- never `git add -A` at the
      # workspace root, which would also see the nested bumelerze-engine/
      # checkout and the vs30-cache/ scratch directory. Idempotent no-op
      # guard: a sweep with nothing new to publish (the common case --
      # most cycles see no qualifying event) commits nothing, matching
      # scripts/publish_atlas.sh's own "additive only, no-op when
      # unchanged" behavior. This step NEVER touches bumelerze-engine (the
      # engine checkout) -- it operates entirely on the workspace root, which
      # `actions/checkout`'s first step (this repo) owns.
      - name: Commit and push newly published products
        if: always()
        shell: bash -el {0}
        run: |
          git config user.name "Bumelerze"
          git config user.email "dev@bumelerze.com"
          git add -A events index.json
          if git diff --cached --quiet; then
            echo "nothing new to publish this sweep"
          else
            git commit -m "Publish products from scheduled sweep (run ${{ github.run_id }})"
            git push origin HEAD:main
          fi
