# Publishes the Atlas as static files over the GitHub Pages CDN, so the app
# and anyone else can fetch products directly by URL.

name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble published tree
        run: |
          mkdir -p _site
          cp -r events _site/events
          # catalog/ holds the bulk event catalogs (Parquet). Without this
          # they exist in the repository but are never served, so the app
          # and anyone else can only get them by cloning.
          cp -r catalog _site/catalog
          # id-crosswalk.json resolves a catalogue id to the published one.
          cp index.json id-crosswalk.json README.md LICENSE _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1